name: installers

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # 1) Static checks on every OS: JSON validity + shell/PowerShell parse.
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: node scripts/ci-validate-json.mjs
      - name: Shell syntax (bash -n)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rc=0
          for f in install.sh plugins/*/install.sh; do
            if bash -n "$f"; then echo "ok $f"; else echo "FAIL $f"; rc=1; fi
          done
          exit $rc
      - name: PowerShell parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e.Count) { $bad++; $e | ForEach-Object { Write-Host "FAIL $($_.Extent.StartLineNumber): $($_.Message)" } }
            else { Write-Host "ok $($_.FullName)" }
          }
          if ($bad) { exit 1 }

  # 1b) Validate the token-diet ctx-wire EN/FR filter pack against its inline
  #     tests (offline simulation of ctx-wire's filter pipeline).
  filters:
    name: ctx-wire filters (EN/FR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify multilingual ctx-wire filters
        run: python3 plugins/token-diet/ctx-wire/scripts/verify-filters.py plugins/token-diet/ctx-wire/filters.d

  # 1c) Compile the plugin extension modules under bun (catches TS/syntax errors
  #     in the guard/routing/provider/context-transform extensions).
  extensions:
    name: extensions compile (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun build the extension modules
        run: |
          rc=0
          for f in \
            plugins/dev-team/extensions/*.ts \
            plugins/token-diet/extensions/*.ts \
            plugins/azure-devops-fs/extensions/*.ts \
            plugins/openai-compatible/extensions/*.ts; do
            if bun build "$f" --target node >/dev/null; then
              echo "ok $f"
            else
              echo "FAIL $f"; rc=1
            fi
          done
          exit $rc
      - name: bun unit tests (pure extension logic)
        run: |
          rc=0
          for t in \
            plugins/token-diet/scripts/extensions.test.ts \
            plugins/dev-team/scripts/extensions.test.ts; do
            echo "== $t =="
            if bun "$t"; then echo "ok $t"; else echo "FAIL $t"; rc=1; fi
          done
          exit $rc

  # 1d) Framework-compliance checks for the dev-team plugin: skill:// anchor
  #     resolution, index.json file integrity, review-agent output-discipline
  #     wiring, and the test-after stance (no removed TDD identifiers).
  compliance:
    name: dev-team framework compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate framework compliance
        run: node scripts/ci-framework-compliance.mjs

  # 2) Real end-to-end install on every OS (bootstraps bun/omp/plugins, then
  #    verifies OMP launches and lists all plugins).
  e2e:
    name: e2e (${{ matrix.os }} real install)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run global installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash install.sh -y
      - name: Verify OMP launches with all plugins (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$HOME/.bun/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          omp --version
          omp plugin list | tee /tmp/plugins.txt
          for p in dev-team copilot-preset token-diet azure-devops-fs openai-compatible datadog; do
            grep -q "$p@omp-dev-team" /tmp/plugins.txt || { echo "missing $p"; exit 1; }
          done
          echo "all plugins installed"

      - name: Run global installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Yes
      - name: Verify OMP launches with all plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:LOCALAPPDATA\omp;$HOME\.local\bin;$HOME\.bun\bin;$HOME\.cargo\bin;$env:Path"
          omp --version
          $list = omp plugin list 2>$null
          $list
          foreach ($p in 'dev-team','copilot-preset','token-diet','azure-devops-fs','openai-compatible','datadog') {
            if (-not ($list | Select-String "$p@omp-dev-team")) { Write-Error "missing $p"; exit 1 }
          }
          Write-Host "all plugins installed"
