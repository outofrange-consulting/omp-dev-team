name: installers

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # 1) Static checks on every OS: JSON validity + shell/PowerShell parse.
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: node scripts/ci-validate-json.mjs
      - name: Shell syntax (bash -n)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rc=0
          for f in install.sh plugins/*/install.sh scripts/lib/*.sh; do
            if bash -n "$f"; then echo "ok $f"; else echo "FAIL $f"; rc=1; fi
          done
          exit $rc
      # `bash -n` only parses. It cannot see `${YES:+-y}` always expanding, a
      # function called before its definition, or unquoted expansions — all of
      # which shipped. shellcheck catches that class.
      - name: shellcheck
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2294 (eval in `run() { eval "$@"; }`) is deliberate: the installers
          # pass composed command STRINGS, not argument arrays.
          LC_ALL=C.UTF-8 shellcheck --severity=warning --shell=bash --exclude=SC2294 \
            install.sh plugins/*/install.sh scripts/lib/*.sh
      - name: PowerShell parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e.Count) { $bad++; $e | ForEach-Object { Write-Host "FAIL $($_.Extent.StartLineNumber): $($_.Message)" } }
            else { Write-Host "ok $($_.FullName)" }
          }
          if ($bad) { exit 1 }

  # 1c) Compile the plugin extension modules under bun (catches TS/syntax errors
  #     in the guard/provider/context-transform extensions).
  extensions:
    name: extensions compile (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # EVERY plugin that ships extensions, discovered from the filesystem — the
      # hardcoded list silently omitted plugins/datadog while the README claimed
      # all extensions were built.
      - name: bun build the extension modules
        run: |
          rc=0
          for f in plugins/*/extensions/*.ts; do
            [ -e "$f" ] || continue
            if bun build "$f" --target node >/dev/null; then
              echo "ok $f"
            else
              echo "FAIL $f"; rc=1
            fi
          done
          exit $rc
      # `bun build` bundles and STRIPS types — it is not a typecheck. A type error
      # compiles clean. This is the actual typecheck.
      - name: typecheck (tsc --noEmit)
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit -p tsconfig.json

  # 1d) Repo self-consistency (skill:// resolution, dead paths, manifest parity,
  #     OMP builtin collisions, agent frontmatter) plus the port invariant.
  compliance:
    name: dev-team framework compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate framework compliance
        run: node scripts/ci-framework-compliance.mjs
      # THE strong invariant: plugins/dev-team must still equal a fresh mechanical
      # conversion of upstream. A hand edit to a ported file fails here instead of
      # silently becoming the drift that made the previous port unmaintainable.
      # (The registry/index generators were retired — upstream ships those files.)
      - name: dev-team matches a fresh conversion of upstream
        run: |
          # Pinned, NOT --depth 1 of a moving HEAD: upstream commits constantly,
          # and diffing against whatever landed there this morning would turn the
          # build red for reasons nobody here can act on. plugins/dev-team/UPSTREAM_REF
          # names the commit this port is defined against; bumping it is how an
          # upstream update enters the repo, as one reviewable change.
          ref="$(sed -n 's/^ref=//p' plugins/dev-team/UPSTREAM_REF)"
          repo="$(sed -n 's/^repo=//p' plugins/dev-team/UPSTREAM_REF)"
          echo "pinned upstream: $repo @ $ref"
          git clone --filter=blob:none --no-checkout "$repo" /tmp/adt
          git -C /tmp/adt checkout --quiet "$ref"
          node scripts/port-upstream-dev-team.mjs --from /tmp/adt/plugins/dev-team --check

  # 1e) The ported plugin's substance is Python. Compile-check every file so a bad
  #     port (or a bad upstream bump) fails here rather than at a tool call.
  python:
    name: dev-team python (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Byte-compile every ported hook and script
        run: python -m compileall -q plugins/dev-team/hooks plugins/dev-team/scripts plugins/dev-team/skills
      - name: py.sh resolves an interpreter
        run: sh plugins/dev-team/hooks/py.sh -c 'import sys; print(sys.version)'

  # 2) Real end-to-end install on every OS (bootstraps bun/omp/plugins, then
  #    verifies OMP launches and lists all plugins).
  e2e:
    name: e2e (${{ matrix.os }} real install)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run global installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash install.sh -y
      - name: Verify OMP launches with all plugins (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$HOME/.bun/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          omp --version
          omp plugin list | tee /tmp/plugins.txt
          for p in dev-team copilot-preset token-diet azure-devops-fs openai-compatible datadog; do
            grep -q "$p@omp-dev-team" /tmp/plugins.txt || { echo "missing $p"; exit 1; }
          done
          echo "all plugins installed"

      # The README's own recommended sequence is "global installer, then the
      # plugin's own installer". That used to re-append whole config snippets,
      # producing DUPLICATE top-level YAML keys which most parsers resolve
      # last-wins — the exact opposite of the "your values are preserved"
      # guarantee. Assert the sequence stays idempotent.
      - name: Re-run per-plugin installers, assert no duplicate YAML keys (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$HOME/.bun/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          for p in dev-team copilot-preset; do
            bash "plugins/$p/install.sh" --apply-config -y || true
          done
          bash plugins/token-diet/install.sh -y || true
          cfg="$HOME/.omp/agent/config.yml"
          dup="$(grep -oE '^[A-Za-z_][A-Za-z0-9_.-]*:' "$cfg" | sort | uniq -d)"
          if [ -n "$dup" ]; then
            echo "DUPLICATE top-level keys in $cfg:"; echo "$dup"
            grep -nE '^[A-Za-z_][A-Za-z0-9_.-]*:' "$cfg"; exit 1
          fi
          echo "config.yml has no duplicate top-level keys"
          python3 -c "import yaml,sys; yaml.safe_load(open('$cfg')); print('config.yml parses as valid YAML')" \
            || echo "(PyYAML unavailable — duplicate-key check still passed)"

      # GITHUB_TOKEN raises the GitHub API limit from the anonymous 60/hour-per-IP
      # (which a shared runner pool exhausts between jobs) to 1000/hour. The
      # installers treat a fetch failure as non-fatal either way; this just stops
      # a third party's rate limit from being the thing that reddens our build.
      - name: Run global installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./install.ps1 -Yes
      - name: Verify OMP launches with all plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:LOCALAPPDATA\omp;$HOME\.local\bin;$HOME\.bun\bin;$HOME\.cargo\bin;$env:Path"
          omp --version
          $list = omp plugin list 2>$null
          $list
          foreach ($p in 'dev-team','copilot-preset','token-diet','azure-devops-fs','openai-compatible','datadog') {
            if (-not ($list | Select-String "$p@omp-dev-team")) { Write-Error "missing $p"; exit 1 }
          }
          Write-Host "all plugins installed"
