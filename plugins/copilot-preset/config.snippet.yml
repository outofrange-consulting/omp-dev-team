# copilot-preset — route Oh-My-Pi through GitHub Copilot
# Paste into ~/.omp/agent/config.yml (or a project .omp/config.yml).
#
# Billing note (changed 2026-06-01): Copilot is now USAGE-BASED — you pay per
# token (input/cached/output) at each model's rate, drawn from your plan's
# monthly AI-credit allowance (1 credit = $0.01). So model choice per tier is
# now a direct $ lever. See pricing.md for the full rate table + comparison.
#
# Auth first (one of):
#   omp                       # then /login -> GitHub Copilot (OAuth), or
#   export COPILOT_GITHUB_TOKEN=...   # (falls back to GH_TOKEN / GITHUB_TOKEN)
# Verify ids against YOUR plan (catalog is fetched live from your Copilot acct):
#   omp --list-models | grep github-copilot

# Restrict OMP to Copilot-served models (recommended for teams).
enabledModels:
  - github-copilot/*

modelProviderOrder:
  - github-copilot

# Tier -> Copilot model (out-of-the-box: cheap execution, Sonnet orchestration,
# Opus for the hard stuff). rates per 1M tokens, in/out — see pricing.md.
modelRoles:
  # The cheap end is SPLIT by workload shape (dev-team's nano + code tiers):
  #
  # smol = NANO tier — pure lexical/checklist review + input-bound scan (no code
  # semantics, no tool-use): naming, complexity, token-efficiency, a11y,
  # progress-guardian. Highest volume, runs in parallel every checkpoint, so the
  # output rate dominates — route to the cheapest capable model. GPT-5-mini is
  # ~55% cheaper output / ~66% cheaper input than MAI, and good enough for
  # checklist work.
  smol: github-copilot/gpt-5-mini          # nano  $0.25 / $2.00
  # task = CODE tier — cheap work that DOES need code semantics or agentic
  # tool-use: post-plan implementation (software-engineer build floor), js-fp &
  # svelte structural review. MAI-Code-1-Flash is coding-tuned and agentic; it
  # beats Haiku 4.5 on every coding bench tested (SWE-Bench Verified 71.6 vs 66.6,
  # SWE-Bench Pro 51.2 vs 35.2, Terminal Bench 2 54.8 vs 41.6) with up to 60%
  # fewer tokens — and it's cheaper than Haiku.
  task: github-copilot/mai-code-1-flash    # code  $0.75 / $4.50
  # everyday DEFAULT — Sonnet 5 runs the dev-team orchestrator (non-trivial work ->
  # research -> plan -> implement -> review). Sonnet 5 lands near-Opus quality on
  # coding & agentic work at the same $3/$15 Sonnet price, so it now also carries
  # architecture/domain DESIGN synthesis (architect, arch-review, domain-review,
  # moved down from the deep tier). MAI-Code-1-Flash (71.6 SWE-bench) stays below
  # it for cross-file orchestration. Want ultra-cheap? See block below.
  default: github-copilot/claude-sonnet-5  # $3.00 / $15.00
  plan: github-copilot/claude-sonnet-5
  # deep reasoning — reserved for high-stakes SECURITY verdicts (security-review,
  # security-engineer) where Opus still leads Sonnet 5.
  slow: github-copilot/claude-opus-4.8     # $5.00 / $25.00

skills:
  enableSkillCommands: true

# ---------------------------------------------------------------------------
# MAI-Code-1-Flash (Microsoft, "MIA Coding"): now wired into the cheap tiers
# above (smol/task). To go further and run the EVERYDAY default ultra-cheap too,
# uncomment — trades some orchestration quality for ~4x cheaper output vs Sonnet:
#
# modelRoles:
#   default: github-copilot/mai-code-1-flash   # ultra-cheap everyday profile
#   plan:    github-copilot/mai-code-1-flash
# ---------------------------------------------------------------------------

# NOTE — running the dev-team fully on Copilot:
# All dev-team agents use provider-agnostic `pi/` role aliases in their `model:`
# frontmatter: `pi/smol` (nano), `pi/task` (code), `pi/plan` (balanced),
# `pi/slow` (deep). Every tier resolves through modelRoles above — no agent
# pins a concrete Anthropic id, so the full team runs on Copilot-served models.
