# copilot-preset — route Oh-My-Pi through GitHub Copilot
# Paste into ~/.omp/agent/config.yml (or a project .omp/config.yml).
#
# Auth first (one of):
#   omp                       # then /login -> GitHub Copilot (OAuth), or
#   export COPILOT_GITHUB_TOKEN=...   # (falls back to GH_TOKEN / GITHUB_TOKEN)
# Verify the catalog:  omp --list-models | grep github-copilot
# (Copilot's available models depend on your plan; adjust ids below to match.)

# Restrict OMP to Copilot-served models (optional but recommended for teams).
enabledModels:
  - github-copilot/*

modelProviderOrder:
  - github-copilot

# Role -> Copilot model. These map the dev-team tiers too:
#   pi/smol (dev-team small/pattern agents) -> a cheap, fast Copilot model
#   default/task (balanced)                 -> a mid Copilot model
#   slow (deep reasoning)                   -> a premium Copilot model
modelRoles:
  default: github-copilot/claude-sonnet-4.5
  task: github-copilot/claude-sonnet-4.5
  smol: github-copilot/gpt-5.4-mini        # or github-copilot/grok-code-fast-1 (cheapest)
  slow: github-copilot/claude-opus-4.6     # or github-copilot/gpt-5.5
  plan: github-copilot/claude-sonnet-4.5

skills:
  enableSkillCommands: true

# NOTE — running the dev-team fully on Copilot:
# dev-team's *small tier* uses the `pi/smol` role, so it follows modelRoles.smol
# above automatically. dev-team's balanced/deep agents PIN concrete Anthropic
# ids (claude-sonnet-4-6 / claude-opus-4-8) in their frontmatter, so they go
# direct to Anthropic unless you either (a) run your interactive default on a
# github-copilot model and rely on it, or (b) edit those agents' `model:` to a
# github-copilot id. See this plugin's README for the trade-off (premium-request
# accounting differs per model).
