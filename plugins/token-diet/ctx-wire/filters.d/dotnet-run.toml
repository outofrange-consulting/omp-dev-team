# dotnet-run (EN + FR) — token-diet multilingual filter for ctx-wire.
# `dotnet run` interleaves the implicit build/restore preamble with the app's
# own stdout. Strip the build chrome (banner, restore lines, the "Proj -> dll"
# artifact line, the "Build succeeded." preamble) and keep the program output;
# build errors / "Build FAILED." pass through untouched.
#
# Microsoft.Testing.Platform (MTP): an MTP test project is a normal console app
# with an entry point, so it is commonly executed via `dotnet run` — its output
# is the MTP "Test run summary:" block. Collapse that to ok on an all-passed run
# (same logic as the dotnet-test MTP path) and preserve failures. A regular app
# never prints "Test run summary:", so non-test runs are unaffected.
#
# FR strings verbatim from MSBuild/NuGet/testfx localization. No Romanian
# (.NET ships none).
schema_version = 1

[filters.dotnet-run]
description = "Compact dotnet run output (EN+FR) - strip build preamble, keep app output; collapse all-passed MTP test runs"
match_command = "^dotnet\\s+run\\b"
strip_ansi = true
match_output = [
  { pattern = "(?m)(Test run summary:|Résumé de série de tests)", message = "dotnet run: tests ok", unless = "(?i)(failed\\s*:\\s*[1-9]|échec\\s*:\\s*[1-9]|Failed!|Échec !|Zero tests ran|Zéro tests exécutés|\\berror\\b)" },
]
strip_lines_matching = [
  "^\\s*$",
  "^Microsoft \\(R\\)",
  "^Copyright \\(C\\)",
  "^\\s*(Determining projects to restore|Identification des projets à restaurer)",
  "^\\s*(Restoring packages for|Restauration des packages pour)",
  "^\\s*(Restored |Restauration effectuée de )",
  "^\\s*(All projects are up-to-date for restore|Tous les projets sont à jour pour la restauration)",
  "^\\s*\\S+ -> .*\\.(dll|exe)$",
  "^(Build succeeded|La génération a réussi)\\.?\\s*$",
]
truncate_lines_at = 240
max_lines = 200

# --- English (plain app) ---
[[tests.dotnet-run]]
name = "EN: build preamble stripped, app output kept"
input = """
  Determining projects to restore...
  All projects are up-to-date for restore.
  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll
Build succeeded.
Hello, World!
"""
expected = "Hello, World!"

[[tests.dotnet-run]]
name = "EN: build failure passes through"
input = """
  Determining projects to restore...
src/Program.cs(10,5): error CS1002: ; expected
Build FAILED.
"""
expected = "src/Program.cs(10,5): error CS1002: ; expected\nBuild FAILED."

# --- English (MTP test project run via dotnet run) ---
[[tests.dotnet-run]]
name = "EN MTP: all-passed test run collapses"
input = """
  MyTests -> /home/user/MyTests/bin/Debug/net8.0/MyTests.dll
Test run summary: Passed!
  total: 42
  failed: 0
  passed: 42
  skipped: 0
  duration: 1s
"""
expected = "dotnet run: tests ok"

[[tests.dotnet-run]]
name = "EN MTP: failing test run preserved"
input = """
failed MyNamespace.MyTests.Test1
Test run summary: Failed!
  total: 42
  failed: 2
  passed: 40
  skipped: 0
  duration: 1s
"""
expected = "failed MyNamespace.MyTests.Test1\nTest run summary: Failed!\n  total: 42\n  failed: 2\n  passed: 40\n  skipped: 0\n  duration: 1s"

# --- French (plain app) ---
[[tests.dotnet-run]]
name = "FR: build preamble stripped, app output kept"
input = """
  Identification des projets à restaurer...
  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll
La génération a réussi.
Bonjour le monde !
"""
expected = "Bonjour le monde !"

[[tests.dotnet-run]]
name = "FR: build failure passes through"
input = """
  Identification des projets à restaurer...
src/Program.cs(10,5): error CS1002: ; attendu
ÉCHEC de la build.
"""
expected = "src/Program.cs(10,5): error CS1002: ; attendu\nÉCHEC de la build."

# --- French (MTP test project run via dotnet run) ---
[[tests.dotnet-run]]
name = "FR MTP: all-passed test run collapses"
input = """
  MyTests -> /home/user/MyTests/bin/Debug/net8.0/MyTests.dll
Résumé de série de tests : Réussite !
  total : 42
  échec : 0
  réussite : 42
  ignoré : 0
  durée : 1s
"""
expected = "dotnet run: tests ok"
