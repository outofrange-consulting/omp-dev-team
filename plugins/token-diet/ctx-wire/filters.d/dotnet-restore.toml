# dotnet-restore (EN + FR) — token-diet multilingual filter for ctx-wire.
# `dotnet restore` output is NuGet's restore log. Short-circuit on success,
# keep NU* errors. FR strings verbatim from NuGet (Strings.fr.xlf) + SDK:
#   "Determining projects to restore..." -> "Identification des projets à restaurer..."
#   "All projects are up-to-date for restore." -> "Tous les projets sont à jour pour la restauration."
#   "Restored {0} (in {1})."   -> "Restauration effectuée de {0} (en {1})."
#   "Nothing to do. None of the projects..." -> "Aucune action. Aucun des projets..."
#   "Restore was successful."  -> "La restauration a réussi."
# No upstream filter exists for restore; this is additive. No Romanian (.NET/
# NuGet ship none).
schema_version = 1

[filters.dotnet-restore]
description = "Compact dotnet restore output (EN+FR) - short-circuit on success, keep NU* errors"
match_command = "^dotnet\\s+restore\\b"
strip_ansi = true
match_output = [
  { pattern = "(?mi)(All projects are up-to-date for restore|Restored .* \\(in |Restore was successful|Nothing to do\\. None of the projects|Tous les projets sont à jour pour la restauration|Restauration effectuée de .* \\(en |La restauration a réussi|Aucune action\\. Aucun des projets)", message = "dotnet restore: ok", unless = "(?i)(\\bNU[0-9]{3,4}\\b|error|introuvable|\\bfailed\\b|unable|impossible)" },
]
strip_lines_matching = [
  "^\\s*$",
  "^Microsoft \\(R\\)",
  "^Copyright \\(C\\)",
  "^\\s*(Determining projects to restore|Identification des projets à restaurer)",
  "^\\s*(Restoring packages for|Restauration des packages pour)",
]
max_lines = 60

# --- English ---
[[tests.dotnet-restore]]
name = "EN: up-to-date collapses"
input = """
  Determining projects to restore...
  All projects are up-to-date for restore.
"""
expected = "dotnet restore: ok"

[[tests.dotnet-restore]]
name = "EN: restored collapses"
input = """
  Determining projects to restore...
  Restored /home/user/MyApp/MyApp.csproj (in 1.2 sec).
"""
expected = "dotnet restore: ok"

[[tests.dotnet-restore]]
name = "EN: NU error preserved"
input = """
  Determining projects to restore...
/home/user/MyApp/MyApp.csproj : error NU1101: Unable to find package Foo. No packages exist with this id in source(s): nuget.org
"""
expected = "/home/user/MyApp/MyApp.csproj : error NU1101: Unable to find package Foo. No packages exist with this id in source(s): nuget.org"

# --- French ---
[[tests.dotnet-restore]]
name = "FR: up-to-date collapses"
input = """
  Identification des projets à restaurer...
  Tous les projets sont à jour pour la restauration.
"""
expected = "dotnet restore: ok"

[[tests.dotnet-restore]]
name = "FR: restored collapses"
input = """
  Identification des projets à restaurer...
  Restauration effectuée de /home/user/MyApp/MyApp.csproj (en 1,2 sec).
"""
expected = "dotnet restore: ok"

[[tests.dotnet-restore]]
name = "FR: NU error preserved"
input = """
  Identification des projets à restaurer...
/home/user/MyApp/MyApp.csproj : error NU1101: Package Foo introuvable. Aucun package associé à cet ID n'existe dans la ou les sources suivantes : nuget.org
"""
expected = "/home/user/MyApp/MyApp.csproj : error NU1101: Package Foo introuvable. Aucun package associé à cet ID n'existe dans la ou les sources suivantes : nuget.org"
