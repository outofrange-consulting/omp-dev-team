# dotnet-test (EN + FR) — token-diet multilingual override for ctx-wire.
# Overrides the bundled English-only `dotnet-test` filter so the success
# short-circuit also fires when VSTest emits French. FR strings are taken
# verbatim from VSTest's own localization (Resources.fr.xlf):
#   "{0} - Failed: {1}, Passed: {2}, ..."  ->
#   "{0} - échec : {1}, réussite : {2}, ignorée(s) : {3}, total : {4}, durée : {5}"
#   "Error Message:"  -> "Message d'erreur :"
#   "Starting test execution, please wait..." ->
#   "Démarrage de l'exécution de tests, patientez..."
# .NET ships no Romanian satellite resources, so EN+FR covers every locale.
schema_version = 1

[filters.dotnet-test]
description = "Compact dotnet test output (EN+FR)"
match_command = "^dotnet\\s+test\\b"
strip_ansi = true
match_output = [
  { pattern = "(?m)(Passed!|Total tests: .* Passed:|réussite\\s*:\\s*\\d|Nombre total de tests\\s*:\\s*\\d|Série de tests réussie)", message = "dotnet test: ok", unless = "(?i)(Failed: [1-9][0-9]*|échec\\s*:\\s*[1-9]|Error Message|Message d'erreur|Échec de la série|\\berror\\b)" },
]
strip_lines_matching = [
  "^\\s*$",
  "^Microsoft \\(R\\)",
  "^Copyright \\(C\\)",
  "^  Determining projects",
  "^Test run for ",
  "^Starting test execution",
  "^Démarrage de (l'exécution|la découverte) de tests",
]
max_lines = 100

# --- English (parity with upstream) ---
[[tests.dotnet-test]]
name = "EN: success collapses"
input = """
Test run for /repo/bin/Debug/net8.0/App.Tests.dll (.NETCoreApp,Version=v8.0)
Starting test execution, please wait...
Passed!  - Failed: 0, Passed: 42, Skipped: 0, Total: 42, Duration: 1 s
"""
expected = "dotnet test: ok"

[[tests.dotnet-test]]
name = "EN: failure preserved"
input = """
Failed TestName [12 ms]
Error Message:
 Expected true but was false
"""
expected = "Failed TestName [12 ms]\nError Message:\n Expected true but was false"

# --- French (the new coverage) ---
[[tests.dotnet-test]]
name = "FR: success collapses"
input = """
Démarrage de l'exécution de tests, patientez...
Réussi !  - échec : 0, réussite : 42, ignorée(s) : 0, total : 42, durée : 1 s
"""
expected = "dotnet test: ok"

[[tests.dotnet-test]]
name = "FR: failure preserved"
input = """
Échec !  - échec : 1, réussite : 41, ignorée(s) : 0, total : 42, durée : 1 s
Message d'erreur :
 Attendu true mais a obtenu false
"""
expected = "Échec !  - échec : 1, réussite : 41, ignorée(s) : 0, total : 42, durée : 1 s\nMessage d'erreur :\n Attendu true mais a obtenu false"

[[tests.dotnet-test]]
name = "FR: failed exit - all-passed summary not collapsed"
failed = true
input = """
Démarrage de l'exécution de tests, patientez...
Réussi !  - échec : 0, réussite : 42, ignorée(s) : 0, total : 42, durée : 1 s
Réussi !  - échec : 0, réussite : 17, ignorée(s) : 0, total : 17, durée : 3 s
"""
expected = "Réussi !  - échec : 0, réussite : 42, ignorée(s) : 0, total : 42, durée : 1 s\nRéussi !  - échec : 0, réussite : 17, ignorée(s) : 0, total : 17, durée : 3 s"
