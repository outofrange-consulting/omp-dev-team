# dotnet-pack (EN + FR) — token-diet multilingual filter for ctx-wire.
# `dotnet pack` runs a build then emits a NuGet packaging summary. On success
# it prints `Successfully created package '<path>.nupkg'.` (often preceded by a
# benign "missing a readme" NOTE). Like `dotnet publish` it does NOT print a
# "Build succeeded." summary in .NET 10. Collapse a clean pack to a short ok;
# keep build/NuGet errors. Success + FR strings verified verbatim against .NET
# 10.0.301 (DOTNET_CLI_UI_LANGUAGE=fr):
#   "Successfully created package '{0}'." -> "Création réussie du package '{0}'."
# No Romanian (.NET / NuGet ship none).
schema_version = 1

[filters.dotnet-pack]
description = "Compact dotnet pack output (EN+FR) - collapse a clean pack to ok, keep errors"
match_command = "^dotnet\\s+pack\\b"
strip_ansi = true
match_output = [
  { pattern = "(?mi)(Successfully created package|Création réussie du package)", message = "dotnet pack: ok", unless = "(?i)(:\\s*error|\\berror\\b|\\bNU[0-9]{3,4}\\b|Build FAILED|La génération a échoué|ÉCHEC de la build|\\bfailed\\b|\\béchec\\b)" },
]
strip_lines_matching = [
  "^\\s*$",
  "^Microsoft \\(R\\)",
  "^Copyright \\(C\\)",
  "^\\s*(Determining projects to restore|Identification des projets à restaurer)",
  "^\\s*(Restoring packages for|Restauration des packages pour)",
  "^\\s*(Restored |Restauration effectuée de )",
  "^\\s*(All projects are up-to-date for restore|Tous les projets sont à jour pour la restauration)",
  "^\\s*\\S+ -> .*\\.(dll|exe)$",
  "^(Build succeeded|La génération a réussi)\\.?\\s*$",
  "^(Time Elapsed|Temps écoulé) ",
]
max_lines = 60

# --- English ---
[[tests.dotnet-pack]]
name = "EN: success collapses (readme NOTE does not block)"
input = """
  Determining projects to restore...
  All projects are up-to-date for restore.
  MyApp -> /home/user/MyApp/bin/Release/net10.0/MyApp.dll
  The package MyApp.1.0.0 is missing a readme. Go to https://aka.ms/nuget/authoring-best-practices/readme to learn why package readmes are important.
  Successfully created package '/home/user/MyApp/bin/Release/MyApp.1.0.0.nupkg'.
"""
expected = "dotnet pack: ok"

[[tests.dotnet-pack]]
name = "EN: build error preserved"
input = """
  Determining projects to restore...
/home/user/MyApp/Program.cs(1,24): error CS1002: ; expected [/home/user/MyApp/MyApp.csproj]
"""
expected = "/home/user/MyApp/Program.cs(1,24): error CS1002: ; expected [/home/user/MyApp/MyApp.csproj]"

# --- French ---
[[tests.dotnet-pack]]
name = "FR: success collapses"
input = """
  Identification des projets à restaurer...
  Tous les projets sont à jour pour la restauration.
  MyApp -> /home/user/MyApp/bin/Release/net10.0/MyApp.dll
  Il manque un fichier Lisez-moi au MyApp.1.0.0 du package. Accédez à https://aka.ms/nuget/authoring-best-practices/readme pour savoir pourquoi les lisez-moi de package sont importants.
  Création réussie du package '/home/user/MyApp/bin/Release/MyApp.1.0.0.nupkg'.
"""
expected = "dotnet pack: ok"

[[tests.dotnet-pack]]
name = "FR: build error preserved"
input = """
  Identification des projets à restaurer...
/home/user/MyApp/Program.cs(1,24): error CS1002: ; attendu [/home/user/MyApp/MyApp.csproj]
"""
expected = "/home/user/MyApp/Program.cs(1,24): error CS1002: ; attendu [/home/user/MyApp/MyApp.csproj]"

[[tests.dotnet-pack]]
name = "NU packaging error not collapsed to ok"
input = """
  MyApp -> /home/user/MyApp/bin/Release/net10.0/MyApp.dll
error NU5017: Cannot create a package that has no dependencies nor content.
"""
expected = "error NU5017: Cannot create a package that has no dependencies nor content."
