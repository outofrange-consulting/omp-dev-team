# dotnet-publish (EN + FR) — token-diet multilingual filter for ctx-wire.
# `dotnet publish` shares `dotnet build`'s restore/build preamble but — unlike
# build — does NOT print a "Build succeeded." / "0 Error(s)" summary in .NET 10
# (verified against 10.0.301, piped and under a PTY). Its success signal is the
# publish artifact line `<Proj> -> <path>/publish/`. So this is a STRIP filter,
# not a success-collapse: drop the restore banner + the intermediate `-> …dll`
# build arrow, and KEEP the `-> …/publish/` line plus any errors/warnings.
#
# Trim / AOT / self-contained publishes emit actionable `warning IL####` /
# `warning TrimmerXXXX` lines — those must survive, so we deliberately do NOT
# collapse to a bare "ok". FR strings verbatim from MSBuild/NuGet localization.
# No Romanian (.NET ships none).
schema_version = 1

[filters.dotnet-publish]
description = "Compact dotnet publish output (EN+FR) - strip restore/build preamble, keep the publish artifact line + errors/warnings"
match_command = "^dotnet\\s+publish\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Microsoft \\(R\\)",
  "^Copyright \\(C\\)",
  "^\\s*(Determining projects to restore|Identification des projets à restaurer)",
  "^\\s*(Restoring packages for|Restauration des packages pour)",
  "^\\s*(Restored |Restauration effectuée de )",
  "^\\s*(All projects are up-to-date for restore|Tous les projets sont à jour pour la restauration)",
  # intermediate build arrow (`Proj -> …/MyApp.dll`); the publish arrow ends in
  # `publish/` and is intentionally NOT matched here, so it survives.
  "^\\s*\\S+ -> .*\\.(dll|exe)$",
  "^(Build succeeded|La génération a réussi)\\.?\\s*$",
  "^(Time Elapsed|Temps écoulé) ",
]
truncate_lines_at = 240
max_lines = 200

# --- English ---
[[tests.dotnet-publish]]
name = "EN: preamble stripped, publish artifact kept"
input = """
  Determining projects to restore...
  All projects are up-to-date for restore.
  MyApp -> /home/user/MyApp/bin/Release/net10.0/MyApp.dll
  MyApp -> /home/user/MyApp/bin/Release/net10.0/publish/
"""
expected = "  MyApp -> /home/user/MyApp/bin/Release/net10.0/publish/"

[[tests.dotnet-publish]]
name = "EN: build error passes through"
input = """
  Determining projects to restore...
  All projects are up-to-date for restore.
/home/user/MyApp/Program.cs(1,24): error CS1002: ; expected [/home/user/MyApp/MyApp.csproj]
"""
expected = "/home/user/MyApp/Program.cs(1,24): error CS1002: ; expected [/home/user/MyApp/MyApp.csproj]"

[[tests.dotnet-publish]]
name = "EN: trim warnings preserved"
input = """
  MyApp -> /home/user/MyApp/bin/Release/net10.0/MyApp.dll
/home/user/MyApp/Program.cs(3,1): warning IL2026: Using member 'X' which has 'RequiresUnreferencedCodeAttribute' [/home/user/MyApp/MyApp.csproj]
  MyApp -> /home/user/MyApp/bin/Release/net10.0/linux-x64/publish/
"""
expected = "/home/user/MyApp/Program.cs(3,1): warning IL2026: Using member 'X' which has 'RequiresUnreferencedCodeAttribute' [/home/user/MyApp/MyApp.csproj]\n  MyApp -> /home/user/MyApp/bin/Release/net10.0/linux-x64/publish/"

# --- French ---
[[tests.dotnet-publish]]
name = "FR: preamble stripped, publish artifact kept"
input = """
  Identification des projets à restaurer...
  Tous les projets sont à jour pour la restauration.
  MyApp -> /home/user/MyApp/bin/Release/net10.0/MyApp.dll
  MyApp -> /home/user/MyApp/bin/Release/net10.0/publish/
"""
expected = "  MyApp -> /home/user/MyApp/bin/Release/net10.0/publish/"

[[tests.dotnet-publish]]
name = "FR: build error passes through"
input = """
  Identification des projets à restaurer...
/home/user/MyApp/Program.cs(1,24): error CS1002: ; attendu [/home/user/MyApp/MyApp.csproj]
"""
expected = "/home/user/MyApp/Program.cs(1,24): error CS1002: ; attendu [/home/user/MyApp/MyApp.csproj]"
