# token-diet config — appended to ~/.omp/agent/config.yml by install.sh.
# Enables skills/commands and isolates OMP from all foreign-tool user configs
# (~/.claude, ~/.codex, ~/.gemini, ~/.cursor, ~/.codeium/windsurf, ~/.copilot,
# ~/.config/opencode) so OMP only loads its own plugins and project-level files.
# (ctx-wire: PATH shims; CodeGraph + context7 MCPs: plugin's .mcp.json)

# Lean tool surface — token-diet's biggest startup-context win. OMP loads every
# tool's JSON schema into the system prompt on every request; with dev-team that
# "System tools" block is ~18K tokens. discoveryMode: all hides all non-essential
# tools behind the built-in on-demand discovery tool (search_tool_bm25) and keeps
# only essentialOverride always loaded, dropping System tools to ~10K (startup
# context ~29K -> ~20K). Nothing is lost — hidden tools are one discovery call
# away. Add any tool you reach for constantly (e.g. ast_grep) to essentialOverride.
tools:
  discoveryMode: all
  essentialOverride: [read, bash, edit, write, find, search, task, todo]
skills:
  enabled: true
  enableSkillCommands: true
  enableClaudeUser: false    # don't load ~/.claude skills into OMP
  enableClaudeProject: false # don't load .claude/ project skills into OMP
  enableCodexUser: false     # don't load ~/.codex skills into OMP
commands:
  enableClaudeUser: false    # don't load ~/.claude commands into OMP
  enableClaudeProject: false # don't load .claude/ project commands into OMP
  enableOpencodeUser: false  # don't load ~/.config/opencode commands into OMP
  enableOpencodeProject: false
disabledProviders:
  - claude-plugins  # ~/.claude/plugins/cache/ — marketplace agents, MCP servers
  - codex           # ~/.codex/ and .codex/ — Codex/OpenAI Codex config
  - gemini          # ~/.gemini/ and .gemini/ — Gemini CLI MCP + extensions
  - cursor          # ~/.cursor/ and .cursor/ — Cursor MCP + rules
  - windsurf        # ~/.codeium/windsurf/ and .windsurf/ — Windsurf rules
  - opencode        # ~/.config/opencode/ and .opencode/ — OpenCode MCP
  - github          # ~/.copilot/ and .github/ — Copilot CLI + instructions
  - cline           # .clinerules — Cline project rules
