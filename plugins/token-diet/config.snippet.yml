# token-diet — user config for Oh-My-Pi (v3.0.0)
#
# The plugin itself needs almost no configuration: lean-ctx is a binary plus an
# extension, both installed by install.sh. What follows is the OMP-native
# settings that pay off alongside it. Every key below was checked against
# packages/coding-agent/src/config/settings-schema.ts.

# Provider isolation: keep other tool ecosystems out of OMP, so it loads only its
# own plugins and project-level files. `github` is deliberately NOT disabled —
# copilot-preset needs it.
disabledProviders:
  - claude-plugins
  - codex
  - gemini
  - cursor
  - windsurf
  - opencode
  - cline

skills:
  enabled: true
  enableSkillCommands: true
  enableClaudeUser: false
  enableClaudeProject: false
  enableCodexUser: false

commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

# Real secret redaction. This is the one the plugin used to OVERCLAIM: the old
# in-process "scrub" preserved high-entropy spans rather than removing them.
# OMP's is the genuine article — add your own patterns to ~/.omp/agent/secrets.yml.
secrets:
  enabled: true

# lean-ctx's own knobs live in ~/.pi/agent/extensions/pi-lean-ctx/config.json
# (that extension resolves its config against ~/.pi, not ~/.omp — install.sh
# writes it to the path it actually reads):
#   mode         additive | replace   — `replace` swaps the native tools outright
#   enableMcp    true | false         — the session cache lives behind this
#   toolProfile  lean | standard | power
