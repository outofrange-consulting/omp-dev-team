# dev-team — user config snippet for Oh-My-Pi
# Docs: https://github.com/can1357/oh-my-pi/blob/main/docs/config-usage.md
#
# Paste into ~/.omp/agent/config.yml (or a project .omp/config.yml). The plugin
# auto-loads its extensions/agents/skills/commands/rules; what you set here is
# your model routing, skills, and subagent graph.

# ---------------------------------------------------------------------------
# MODEL ROUTING (tier -> model)
# ---------------------------------------------------------------------------
# Agents declare a tier in their `model:` frontmatter (the cheap end is split by
# WORKLOAD SHAPE):
#   nano (lexical/scan) agents -> `pi/smol`   (resolved here, role smol)
#   code (coding/tool-use)     -> `pi/task`   (resolved here, role task)
#   balanced agents            -> `pi/plan`   (resolved here, role plan)
#   deep-reasoning agents      -> `pi/slow`   (resolved here, role slow)
#
# nano + code are CHEAP-CLOUD high-volume tiers: nano is pure lexical/checklist
# review and input-bound scan (no code semantics, no tool-use); code is cheap
# coding & agentic tool-use. Keep both on the cheapest capable model for the
# shape. On base Anthropic both resolve to Haiku; copilot-preset splits them
# (smol -> gpt-5-mini, task -> mai-code-1-flash).
modelRoles:
  # nano tier (lexical/scan) -> cheapest capable. copilot-preset -> gpt-5-mini.
  smol: claude-haiku-4-5
  # code tier (coding/tool-use) -> cheap coding model. copilot-preset -> mai-code-1-flash.
  task: claude-haiku-4-5
  # everyday DEFAULT -> Sonnet runs the orchestrator (non-trivial -> research ->
  # plan -> implement -> review).
  default: claude-sonnet-4-6
  plan: claude-sonnet-4-6
  # deep reasoning / big-complex analysis.
  slow: claude-opus-4-8
  # (With copilot-preset, the global installer wires these to github-copilot/* .)

# ---------------------------------------------------------------------------
# SKILLS
# ---------------------------------------------------------------------------
# All ported dev-team skills live under .omp/skills/<name>/SKILL.md. Enabling
# skill commands exposes every skill as `/skill:<name>` in addition to being
# readable by agents via skill://<name>.
skills:
  enabled: true
  enableSkillCommands: true

# ---------------------------------------------------------------------------
# TOOL SURFACE (drop tools the team never uses -> smaller context)
# ---------------------------------------------------------------------------
# Every enabled tool's JSON schema is loaded into the system prompt on every
# request. dev-team agents work exclusively through read/bash/edit/find/search/
# task (see each agent's `tools:` frontmatter) plus the systematic-debugging
# skill — none declare the DAP `debug` tool or the Python/JS `eval` code-exec
# tool. Turning them off removes their schemas from startup context (~3K) with
# no loss of capability. (Paired with token-diet's discoveryMode they would be
# hidden anyway; disabling them keeps them out of the discovery set too.)
debug:
  enabled: false
eval:
  py: false
  js: false

# ---------------------------------------------------------------------------
# EXTENSIONS (the "blocking scripts" — ported from the Claude Code shell hooks)
# ---------------------------------------------------------------------------
# Note: the guard/routing extensions load automatically from the plugin
# manifest (plugins/dev-team/package.json -> omp.extensions). You do NOT list
# them here. (Only add an `extensions:` list if you run dev-team as a raw .omp
# workspace instead of an installed plugin.)

# ---------------------------------------------------------------------------
# IMPL-VERIFY (deterministic build+test gate — /impl-verify)
# ---------------------------------------------------------------------------
# The /impl-verify command (extension, auto-loaded) detects the stack and runs
# the STRICT build + tests with a bounded fix counter. It is configured NOT here
# but per-project in `.omp/dev-team.json` (so build/test commands travel with the
# repo, not your global config):
#
#   {
#     "implVerify": {
#       "maxFixes": 3,
#       "stacks": {
#         "dotnet": { "build": "dotnet build -warnaserror", "test": "dotnet test" },
#         "node":   { "build": "bun run build", "test": "bun test" }
#       }
#     }
#   }
#
# Defaults (strict) ship per stack; override only what differs. Detection:
# .csproj/.sln -> dotnet, Cargo.toml -> rust, go.mod -> go, pyproject.toml ->
# python, package.json -> node (dotnet wins a mixed repo).

# ---------------------------------------------------------------------------
# EFFORT-BAND MODEL ROUTING (model-routing extension)
# ---------------------------------------------------------------------------
# Phase-aware bump-from-floor: the effort goes into spec/plan, not the build. The
# TASK SIZE (set by /scope) raises the band ONLY while planning (stage
# needs-plan): target trivial->code, standard->balanced, complex->deep, and
# effective = max(agent floor, target). Once the plan is approved, build/review
# run at the floor (no bump) — a solid plan makes the build routine. An agent is
# never routed BELOW its tier (high-stakes deep agents hold). No signal -> floor.
# Configured in skills/dev-team-knowledge/model-routing.json -> effortBand;
# copilot-preset unaffected (the band picks a tier; modelRoles resolves it).
#
# Enforcement is set there (default "advisory") and overridable per-run by env:
#   DEV_TEAM_EFFORT_ROUTING=advisory   # log + warn on mismatch (default)
#   DEV_TEAM_EFFORT_ROUTING=enforce    # block a mis-banded dispatch
#   DEV_TEAM_EFFORT_ROUTING=off        # disable the band (pure static tiers)
# Inspect with /routing.
#
# Optional extra saving (off by default): set effortBand.trivialDownshift=true in
# model-routing.json to route agents ONE band BELOW their floor on a trivial
# (fast-path) task — except a deep floor (protectDownshift), which holds. The only
# case an agent goes below its tier; leave off to keep the never-below-floor rule.

# ---------------------------------------------------------------------------
# TASK / SUBAGENT GRAPH
# ---------------------------------------------------------------------------
task:
  # Allow deep enough nesting for orchestrator -> implementer -> explore.
  maxRecursionDepth: 4
  # Let custom task calls pass schemas through to structured-output agents.
  simple: default
