# dev-team — user config snippet for Oh-My-Pi
# Docs: https://github.com/can1357/oh-my-pi/blob/main/docs/config-usage.md
#
# Paste into ~/.omp/agent/config.yml (or a project .omp/config.yml). The plugin
# auto-loads its extensions/agents/skills/commands/rules; what you set here is
# your model routing, skills, and subagent graph.

# ---------------------------------------------------------------------------
# MODEL ROUTING (role -> model)
# ---------------------------------------------------------------------------
# Agents declare a role in their `model:` frontmatter, canonical `@role` prefix
# (`pi/role` is still accepted but is LEGACY_MODEL_ROLE_ALIAS_PREFIX —
# omp/packages/coding-agent/src/config/model-roles.ts:9-15):
#   nano (lexical/scan) agents -> `@smol`
#   code (coding/tool-use)     -> `@smol` (see the `task` note below)
#   balanced agents            -> `@plan`
#   deep-reasoning agents      -> `@slow`
#   design/UI agents           -> `@designer`
#
# Agents declare a COMMA-SEPARATED fallback list (`@plan, @default`) because
# parseModelList takes CSV and the first *resolvable* pattern wins — an
# unresolvable role is skipped, not fatal (discovery/helpers.ts:216-221). That
# keeps the team working for a user who never pasted this snippet.
#
# WHY EVERY VALUE IS A LIST, AND WHY BOTH ID SPELLINGS APPEAR:
# there is no dot/dash normalization anywhere in the catalog's id matcher
# (packages/catalog/src/identity/id.ts only trims whitespace, lowercases, and
# strips bracketed affixes). Anthropic writes `claude-opus-4-8`, GitHub Copilot
# writes `claude-opus-4.8`. OMP's own priority.json hedges the same way
# ("opus-4.8", "opus-4-8", "haiku-4-5", "haiku-4.5"). Listing both spellings
# plus a non-Anthropic third choice is what makes this block provider-neutral:
# whichever provider you are logged into, one pattern resolves.
modelRoles:
  # everyday DEFAULT -> runs the orchestrator (non-trivial -> research -> plan ->
  # implement -> review) and carries architecture/domain DESIGN synthesis.
  default: [claude-sonnet-5, claude-sonnet-4-6, claude-sonnet-4.6, gpt-5.5]
  # deep reasoning -> high-stakes SECURITY verdicts (security-review,
  # security-engineer) and the design-synthesis agents' first choice.
  slow: [claude-opus-4-8, claude-opus-4.8, gpt-5.5:xhigh]
  # nano tier: pure lexical/checklist review + input-bound scan. Highest volume,
  # runs in parallel every checkpoint -> cheapest capable model wins.
  smol: [claude-haiku-4-5, claude-haiku-4.5, gpt-5.4-mini, gpt-5-mini]
  # MUST be set explicitly. `plan` has NO priority.json chain (that file has
  # exactly three keys: smol, slow, designer) and is NOT in
  # shouldInheritDefaultBeforePriority (model-resolver.ts:946-948, which returns
  # true only for smol/slow/designer). An unset `plan` therefore resolves to
  # undefined and every `@plan` agent silently falls through to the parent
  # SESSION model — the opposite of a declared tier.
  plan: "@default"
  # MUST be set explicitly, for the opposite reason: `@task` (like `@default`)
  # is *deliberately* session-inheriting (isSessionInheritedAgentPattern,
  # model-resolver.ts:935-944). That is right for OMP's generic `task` agent and
  # wrong for a "cheap code tier", so pin it to the cheap chain.
  task: "@smol"
  # designer -> UI/UX + a11y work. OMP's own designer chain is Gemini-first
  # (priority.json), so we follow it rather than invent one.
  designer: [gemini-3.1-pro-preview, gemini-3-pro-preview, claude-sonnet-5]
  # vision is LOAD-BEARING, not decorative: inspect_image resolves
  # @vision -> @default -> active model and then HARD-ERRORS if the resolved
  # model has no "image" input modality (tools/inspect-image.ts:158-172). Any
  # profile that puts a text-only model on `default` breaks image handling
  # unless `vision` is pinned.
  vision: [claude-sonnet-5, gemini-3.1-pro-preview]
  # advisor -> second-opinion reviewer. It aliases the `slow` chain but NEVER
  # inherits the primary (ROLE_PRIORITY_ALIAS + the doc comment at
  # model-resolver.ts:950-963), so it stays a distinct strong model. `:medium`
  # keeps the passive reviewer from costing more than the turn it reviews.
  advisor: [claude-opus-4-8:medium, claude-opus-4.8:medium, gpt-5.5:medium]
  # tiny / commit: DELIBERATELY UNSET. ROLE_PRIORITY_ALIAS maps tiny -> smol
  # (model-resolver.ts:960-963) and commit resolves via
  # ["commit","smol",...MODEL_ROLE_IDS] (commit/model-selection.ts:46), so both
  # already land on our smol chain. Setting them is a no-op today — set them
  # ONLY to make them diverge from smol.
  # (With copilot-preset, the global installer wires these to github-copilot/* .)

# Which roles /model cycling walks through. OMP's default is
# [smol, default, slow] (settings-schema.ts:314); we insert `plan` because it is
# a first-class tier here, not an alias of default.
cycleOrder: [smol, default, plan, slow]

# Assigning modelRoles.advisor does NOT turn the advisor on — `advisor.enabled`
# is a separate boolean, default false (settings-schema.ts:441-443). Set it to
# true only when you want a second model reviewing every turn (it bills a
# second stream). Left off deliberately.
advisor:
  enabled: false

# ---------------------------------------------------------------------------
# SKILLS
# ---------------------------------------------------------------------------
# All ported dev-team skills live under .omp/skills/<name>/SKILL.md. Enabling
# skill commands exposes every skill as `/skill:<name>` in addition to being
# readable by agents via skill://<name>.
skills:
  enabled: true
  enableSkillCommands: true

# ---------------------------------------------------------------------------
# TOOL SURFACE (drop tools the team never uses -> smaller context)
# ---------------------------------------------------------------------------
# Every enabled tool's JSON schema is loaded into the system prompt on every
# request. dev-team agents work exclusively through read/bash/edit/find/search/
# task (see each agent's `tools:` frontmatter) plus the systematic-debugging
# skill — none declare the DAP `debug` tool or the Python/JS `eval` code-exec
# tool. Turning them off removes their schemas from startup context (~3K) with
# no loss of capability. (OMP's own `tools.xdev`, default on, already mounts
# non-essential and MCP tools as `xd://` devices under a doc budget — nothing to
# configure there; disabling these two keeps them out of that set as well.)
debug:
  enabled: false
eval:
  py: false
  js: false

# ---------------------------------------------------------------------------
# EXTENSIONS (the "blocking scripts" — ported from the Claude Code shell hooks)
# ---------------------------------------------------------------------------
# Note: the guard extensions load automatically from the plugin
# manifest (plugins/dev-team/package.json -> omp.extensions). You do NOT list
# them here. (Only add an `extensions:` list if you run dev-team as a raw .omp
# workspace instead of an installed plugin.)

# ---------------------------------------------------------------------------
# UPSTREAM'S PYTHON HOOK LAYER
# ---------------------------------------------------------------------------
# This plugin is a verbatim port of agentic-dev-team v10.20.0. Its guards, gates,
# telemetry and build verification are upstream's Python hooks, run unmodified by
# extensions/hook-bridge.ts — there is nothing to configure here, but there IS a
# hard requirement: python3 must be on PATH (or DEV_TEAM_PYTHON set). Without it
# the whole layer is inert and OMP says so at session start.
#
#   DEV_TEAM_PYTHON           explicit interpreter, e.g. "py -3"
#   DEV_TEAM_HOOK_TIMEOUT_MS  per-hook wall clock (default 15000)
#
# Upstream's own knobs still apply, e.g. DEV_TEAM_MAX_PARALLEL_BUILDS.

# ---------------------------------------------------------------------------
# TASK / SUBAGENT GRAPH
# ---------------------------------------------------------------------------
task:
  # Allow deep enough nesting for orchestrator -> implementer -> explore.
  maxRecursionDepth: 4
  # Let custom task calls pass schemas through to structured-output agents.
  simple: default
