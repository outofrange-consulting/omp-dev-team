# dev-team — user config snippet for Oh-My-Pi
# Docs: https://github.com/can1357/oh-my-pi/blob/main/docs/config-usage.md
#
# Paste into ~/.omp/agent/config.yml (or a project .omp/config.yml). The plugin
# auto-loads its extensions/agents/skills/commands/rules; what you set here is
# your model routing, skills, and subagent graph.

# ---------------------------------------------------------------------------
# MODEL ROUTING (tier -> model)
# ---------------------------------------------------------------------------
# Agents declare a tier in their `model:` frontmatter:
#   small/pattern agents -> `pi/smol`        (resolved here)
#   balanced agents      -> `claude-sonnet-4-6`
#   deep-reasoning agents-> `claude-opus-4-8`
#
# The small tier is a CHEAP-CLOUD, high-volume tier: lexical/structural checks
# and checklist reviews that don't need Sonnet/Opus. Keep it on the cheapest
# capable model to limit token spend.
modelRoles:
  # Small tier -> cheapest capable model. Default: Haiku. With the copilot-preset
  # plugin you can point this at github-copilot/gpt-5-mini (or mai-code-1-flash)
  # to run the whole high-volume tier on your Copilot license for less.
  smol: claude-haiku-4-5
  # Deep-reasoning tier alias (used by a few commands/agents via pi/slow).
  slow: claude-opus-4-8
  # Subagent default for agents that don't pin a model:
  task: claude-sonnet-4-6
  # `default` is intentionally left to the user's interactive choice (--model).

# ---------------------------------------------------------------------------
# SKILLS
# ---------------------------------------------------------------------------
# All ported dev-team skills live under .omp/skills/<name>/SKILL.md. Enabling
# skill commands exposes every skill as `/skill:<name>` in addition to being
# readable by agents via skill://<name>.
skills:
  enabled: true
  enableSkillCommands: true

# ---------------------------------------------------------------------------
# EXTENSIONS (the "blocking scripts" — ported from the Claude Code shell hooks)
# ---------------------------------------------------------------------------
# Note: the guard/routing extensions load automatically from the plugin
# manifest (plugins/dev-team/package.json -> omp.extensions). You do NOT list
# them here. (Only add an `extensions:` list if you run dev-team as a raw .omp
# workspace instead of an installed plugin.)

# ---------------------------------------------------------------------------
# TASK / SUBAGENT GRAPH
# ---------------------------------------------------------------------------
task:
  # Allow deep enough nesting for orchestrator -> implementer -> explore.
  maxRecursionDepth: 4
  # Let custom task calls pass schemas through to structured-output agents.
  simple: default
