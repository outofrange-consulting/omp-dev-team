# dotnet-tool (EN + FR) — token-diet multilingual filter for ctx-wire.
# Collapses successful `dotnet tool install/update/uninstall` to a short ok;
# `dotnet tool list` (a table) and any error pass through. FR strings verbatim
# from the .NET SDK (CliCommandStrings.fr.xlf):
#   "...was successfully installed."   -> "...a été (correctement )?installé..."
#   "...was successfully updated..."   -> "...a été correctement mis à jour..."
#   "...was successfully uninstalled." -> "...a été désinstallé..."
#   "...is up to date..."              -> "...est à jour..."
# No Romanian (.NET ships none).
schema_version = 1

[filters.dotnet-tool]
description = "Compact dotnet tool install/update/uninstall (EN+FR); list + errors pass through"
match_command = "^dotnet\\s+tool\\b"
strip_ansi = true
match_output = [
  { pattern = "(?mi)(was successfully (installed|updated|uninstalled)|is up to date|a été (correctement )?(installé|mis à jour|désinstallé)|est à jour)", message = "dotnet tool: ok", unless = "(?i)(error|\\bfailed\\b|introuvable|could not|unable|impossible|n'a pas)" },
]
strip_lines_matching = [
  "^\\s*$",
  "^(You can invoke the tool|Vous pouvez appeler l'outil)",
]
max_lines = 40

# --- English ---
[[tests.dotnet-tool]]
name = "EN: install collapses"
input = """
You can invoke the tool using the following command: dotnet-foo
Tool 'dotnet-foo' (version '1.2.3') was successfully installed.
"""
expected = "dotnet tool: ok"

[[tests.dotnet-tool]]
name = "EN: update collapses"
input = "Tool 'dotnet-foo' was successfully updated from version '1.0.0' to version '1.2.3'."
expected = "dotnet tool: ok"

[[tests.dotnet-tool]]
name = "EN: list table passes through"
input = """
Package Id      Version      Commands
-------------------------------------------
dotnet-foo      1.2.3        dotnet-foo
"""
expected = "Package Id      Version      Commands\n-------------------------------------------\ndotnet-foo      1.2.3        dotnet-foo"

# --- French ---
[[tests.dotnet-tool]]
name = "FR: install collapses"
input = """
Vous pouvez appeler l'outil à l'aide de la commande suivante : dotnet-foo
L'outil 'dotnet-foo' (version '1.2.3') a été installé correctement.
"""
expected = "dotnet tool: ok"

[[tests.dotnet-tool]]
name = "FR: update collapses"
input = "L'outil 'dotnet-foo' a été correctement mis à jour de la version '1.0.0' à la version '1.2.3'."
expected = "dotnet tool: ok"

[[tests.dotnet-tool]]
name = "FR: install failure preserved"
input = "L'outil 'dotnet-foo' n'a pas pu être installé : error NU1101: Package introuvable."
expected = "L'outil 'dotnet-foo' n'a pas pu être installé : error NU1101: Package introuvable."
