# dotnet-build (EN + FR) — token-diet multilingual override for ctx-wire.
# Overrides the bundled English-only `dotnet-build` filter so the success
# short-circuit also fires when MSBuild emits French (DOTNET_CLI_UI_LANGUAGE/
# VSLANG=fr). .NET ships no Romanian satellite resources, so EN+FR covers every
# locale the .NET CLI can produce. FR strings are taken verbatim from MSBuild
# (Strings.fr.xlf) and NuGet (Strings.fr.xlf):
#   "Build succeeded."          -> "La génération a réussi."
#   "{0} Warning(s)"            -> "{0} Avertissement(s)"
#   "{0} Error(s)"              -> "{0} Erreur(s)"
#   "Determining projects to restore..." -> "Identification des projets à restaurer..."
schema_version = 1

[filters.dotnet-build]
description = "Compact dotnet build output (EN+FR) - short-circuit on success, strip banners + restore noise"
match_command = "^dotnet\\s+build\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Microsoft \\(R\\)",
  "^Copyright \\(C\\)",
  "^\\s*(Determining projects to restore|Identification des projets à restaurer)",
  "^\\s*(Restoring packages for|Restauration des packages pour)",
  "^\\s*(Restored |Restauration effectuée de )",
  "^\\s*(All projects are up-to-date for restore|Tous les projets sont à jour pour la restauration)",
]
match_output = [
  { pattern = "0 (Warning\\(s\\)|Avertissement\\(s\\))\\n\\s+0 (Error\\(s\\)|Erreur\\(s\\))", message = "ok (build succeeded)" },
]
max_lines = 40

# --- English (parity with upstream) ---
[[tests.dotnet-build]]
name = "EN: successful build short-circuits to ok"
input = """
Microsoft (R) Build Engine version 17.8.3+195e7f5a3
Copyright (C) Microsoft Corporation. All rights reserved.

  Determining projects to restore...
  All projects are up-to-date for restore.
  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll

Build succeeded.
    0 Warning(s)
    0 Error(s)

Time Elapsed 00:00:02.34
"""
expected = "ok (build succeeded)"

[[tests.dotnet-build]]
name = "EN: build errors pass through"
input = """
Microsoft (R) Build Engine version 17.8.3+195e7f5a3
Copyright (C) Microsoft Corporation. All rights reserved.

  Determining projects to restore...
src/Program.cs(10,5): error CS1002: ; expected [/home/user/MyApp/MyApp.csproj]

Build FAILED.
    0 Warning(s)
    1 Error(s)
"""
expected = "src/Program.cs(10,5): error CS1002: ; expected [/home/user/MyApp/MyApp.csproj]\nBuild FAILED.\n    0 Warning(s)\n    1 Error(s)"

# --- French (the new coverage) ---
[[tests.dotnet-build]]
name = "FR: successful build short-circuits to ok"
input = """
Microsoft (R) Build Engine version 17.8.3+195e7f5a3
Copyright (C) Microsoft Corporation. Tous droits réservés.

  Identification des projets à restaurer...
  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll

La génération a réussi.
    0 Avertissement(s)
    0 Erreur(s)

Temps écoulé 00:00:02.34
"""
expected = "ok (build succeeded)"

[[tests.dotnet-build]]
name = "FR: build errors pass through"
input = """
  Identification des projets à restaurer...
src/Program.cs(10,5): error CS1002: ; attendu [/home/user/MyApp/MyApp.csproj]

ÉCHEC de la build.
    0 Avertissement(s)
    1 Erreur(s)
"""
expected = "src/Program.cs(10,5): error CS1002: ; attendu [/home/user/MyApp/MyApp.csproj]\nÉCHEC de la build.\n    0 Avertissement(s)\n    1 Erreur(s)"

[[tests.dotnet-build]]
name = "FR: failed exit - clean-looking summary not collapsed to ok"
failed = true
input = """
  Identification des projets à restaurer...
  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll

La génération a réussi.
    0 Avertissement(s)
    0 Erreur(s)

Temps écoulé 00:00:02.34
"""
expected = "  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll\nLa génération a réussi.\n    0 Avertissement(s)\n    0 Erreur(s)\nTemps écoulé 00:00:02.34"
